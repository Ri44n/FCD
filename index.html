<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown</title>
<style>
  :root {
    --face: "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Segoe UI", system-ui, sans-serif;

    /* chosen by the user */
    --bg: #1f2733;
    --title: #ffffff;
    --digits: #ffffff;
    --title-scale: 1;
    --digit-scale: 1;

    /* settings page */
    --ui-bg: #eef1f4;
    --panel: #ffffff;
    --ink: #1c232c;
    --soft: #5b6672;
    --line: #d5dbe1;
    --accent: #2f5d8a;
    --accent-ink: #ffffff;
    --danger: #a3372f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ui-bg: #161b22;
      --panel: #1f262f;
      --ink: #e8edf2;
      --soft: #9aa6b2;
      --line: #333d48;
      --accent: #7fb0e0;
      --accent-ink: #10161d;
      --danger: #ec8a80;
    }
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: var(--face); line-height: 1.5; }
  [hidden] { display: none !important; }

  /* ---------------- Settings page ---------------- */
  #settings {
    min-height: 100%;
    background: var(--ui-bg);
    color: var(--ink);
    padding: 2rem 1rem 3rem;
  }
  .wrap { max-width: 36rem; margin: 0 auto; }
  #settings h1 { font-size: 1.75rem; font-weight: 400; margin-bottom: 1.25rem; }

  .preview {
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    background: var(--bg);
    display: grid;
    grid-template-rows: auto 1fr;
    padding: 6% 5%;
    text-align: center;
    margin-bottom: 1.5rem;
    box-shadow: inset 0 0 0 1px rgba(127, 127, 127, 0.25);
    container-type: inline-size;
    overflow: hidden;
  }
  .preview .p-title {
    color: var(--title);
    font-weight: 600;
    font-size: calc(clamp(1.1rem, 4.6vw, 1.9rem) * var(--title-scale));
    line-height: 1.1;
    text-wrap: balance;
    transform: translateY(2.8cqw);
  }
  .preview .p-clock {
    align-self: center;
    color: var(--digits);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    gap: 0 5%;
    font-size: calc(clamp(1.6rem, 7vw, 2.8rem) * var(--digit-scale));
    font-weight: 300;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .preview .p-clock small { font-size: 0.4em; opacity: 0.8; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.5rem;
    display: grid;
    gap: 1.4rem;
  }
  .label { display: block; font-size: 0.95rem; margin-bottom: 0.45rem; }
  .hint { color: var(--soft); font-size: 0.85rem; margin-top: 0.35rem; }
  input[type="text"], input[type="date"], input[type="time"] {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--ui-bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.55rem 0.7rem;
  }
  .row { display: grid; grid-template-columns: 1fr 9rem; gap: 0.75rem; }
  @media (max-width: 30rem) { .row { grid-template-columns: 1fr; } }
  .slider { display: grid; grid-template-columns: 1fr 3.5rem; gap: 0.75rem; align-items: center; margin-top: 0.8rem; }
  .slider output { text-align: right; font-variant-numeric: tabular-nums; color: var(--soft); }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Colour dots */
  .swatches { display: flex; flex-wrap: wrap; gap: 0.7rem; border: 0; padding: 0; }
  .swatch { position: relative; width: 2.1rem; height: 2.1rem; }
  .swatch input {
    position: absolute; inset: 0; margin: 0;
    opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .swatch span {
    display: block; width: 100%; height: 100%;
    border-radius: 50%;
    background: var(--c);
    box-shadow: inset 0 0 0 1px rgba(127, 127, 127, 0.45);
    pointer-events: none;
  }
  .swatch.custom span {
    background: conic-gradient(#e5484d, #f5a524, #f2e14c, #46a758, #3e8ed0, #8e4ec6, #e5484d);
  }
  .swatch.custom.has-colour span {
    background: var(--c);
    box-shadow: inset 0 0 0 1px rgba(127, 127, 127, 0.45), inset 0 0 0 4px var(--panel), inset 0 0 0 5px rgba(127,127,127,.45);
  }
  .swatch input:checked + span,
  .swatch.selected span { outline: 2px solid var(--ink); outline-offset: 3px; }
  .swatch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 3px; }

  .launch {
    font: inherit;
    font-size: 1.15rem;
    width: 100%;
    padding: 0.85rem 1rem;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  #launchMsg { color: var(--danger); font-size: 0.95rem; margin-top: 0.5rem; min-height: 1.5em; }

  /* ---------------- Countdown screen ---------------- */
  #screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 7vh 5vw 3vh;
    text-align: center;
    overflow: hidden;
    cursor: none;
  }
  #screen.awake { cursor: auto; }
  #screen h2 {
    color: var(--title);
    font-weight: 600;
    font-size: calc(clamp(2.4rem, 7.5vw, 13vh) * var(--title-scale));
    line-height: 1.05;
    transform: translateY(5vh); /* a little lower, without moving the countdown */
    max-width: 20ch;
    margin-inline: auto;
    text-wrap: balance;
  }
  .clock {
    align-self: center;
    color: var(--digits);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    column-gap: 4vw;
    row-gap: 2vh;
  }
  .unit { display: flex; align-items: baseline; gap: 0.25em; white-space: nowrap; }
  .num {
    font-size: calc(clamp(3.5rem, 12vw, 30vh) * var(--digit-scale));
    font-weight: 300;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .lbl { font-size: calc(clamp(1.2rem, 3.6vw, 9vh) * var(--digit-scale)); opacity: 0.8; }
  .empty { align-self: center; color: var(--digits); opacity: 0.8; font-size: clamp(1.1rem, 2.4vw, 2rem); }

  /* Small settings button: only appears when the mouse moves */
  .to-settings {
    justify-self: center;
    font: inherit;
    font-size: 0.95rem;
    color: var(--digits);
    background: transparent;
    border: 1px solid currentColor;
    border-radius: 999px;
    padding: 0.35rem 1.1rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #screen.awake .to-settings, .to-settings:focus-visible { opacity: 0.75; }
  .to-settings:hover { opacity: 1 !important; }
  @media (prefers-reduced-motion: reduce) { .to-settings { transition: none; } }
</style>
</head>
<body>

<!-- ============ Page 1: settings ============ -->
<section id="settings">
  <div class="wrap">
    <h1>Countdown settings</h1>

    <div class="preview" aria-hidden="true">
      <div class="p-title" id="pTitle"></div>
      <div class="p-clock">
        <span><span id="pd">0</span> <small id="pdl">days</small></span>
        <span><span id="ph">0</span> <small id="phl">hours</small></span>
        <span><span id="pm">0</span> <small id="pml">minutes</small></span>
      </div>
    </div>

    <div class="panel">
      <div>
        <label class="label" for="title">Title</label>
        <input type="text" id="title" maxlength="120" placeholder="E.g. Counting down to the year-end function">
      </div>

      <div>
        <span class="label" id="whenLabel">When is it?</span>
        <div class="row" role="group" aria-labelledby="whenLabel">
          <input type="date" id="date" aria-label="Date">
          <input type="time" id="time" aria-label="Time">
        </div>
        <p class="hint">Without a time, it counts down to midnight at the start of that day.</p>
      </div>

      <div>
        <span class="label" id="titleColourLabel">Title colour and size</span>
        <div class="swatches" id="titleColour" role="radiogroup" aria-labelledby="titleColourLabel"></div>
        <label class="slider"><input type="range" id="titleSize" min="50" max="200" step="5" aria-label="Title size"><output id="titleSizeOut"></output></label>
      </div>

      <div>
        <span class="label" id="digitColourLabel">Countdown colour and size</span>
        <div class="swatches" id="digitColour" role="radiogroup" aria-labelledby="digitColourLabel"></div>
        <label class="slider"><input type="range" id="digitSize" min="50" max="200" step="5" aria-label="Countdown size"><output id="digitSizeOut"></output></label>
      </div>

      <div>
        <span class="label" id="bgColourLabel">Background colour</span>
        <div class="swatches" id="bgColour" role="radiogroup" aria-labelledby="bgColourLabel"></div>
      </div>

      <div>
        <button type="button" class="launch" id="launch">Launch</button>
        <p id="launchMsg" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>
</section>

<!-- ============ Page 2: countdown ============ -->
<section id="screen" hidden>
  <h2 id="sTitle"></h2>
  <div class="clock" id="clock">
    <div class="unit"><span class="num" id="d">0</span><span class="lbl" id="dl">days</span></div>
    <div class="unit"><span class="num" id="h">0</span><span class="lbl" id="hl">hours</span></div>
    <div class="unit"><span class="num" id="m">0</span><span class="lbl" id="ml">minutes</span></div>
  </div>
  <button type="button" class="to-settings" id="toSettings">Settings</button>
</section>

<script>
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const STORE = "countdown-screen-v1";

  const TEXT_COLOURS = ["#ffffff", "#f3e9d2", "#e8b84a", "#ff8a7a", "#8fe0b8", "#8fc7ff", "#c9b6ff", "#1c232c"];
  const BG_COLOURS   = ["#1f2733", "#14171c", "#1e3a5f", "#1f3d36", "#4a1f2b", "#3b2a55", "#7a3b1d", "#f4f2ee"];

  const state = {
    title: "Counting down",
    date: "",
    time: "",
    titleColour: "#ffffff",
    digitColour: "#ffffff",
    bgColour: "#1f2733",
    titleSize: 100,
    digitSize: 100,
    view: "settings",
  };

  // ---------- storage (the browser remembers settings for this file) ----------
  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE) || "{}");
      Object.assign(state, saved);
    } catch (e) { /* storage unavailable: use defaults */ }
  }
  function saveState() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  }

  // ---------- colour dots ----------
  function buildSwatches(containerId, colours, key) {
    const box = $(containerId);
    const name = containerId;
    colours.forEach((c) => {
      const label = document.createElement("label");
      label.className = "swatch";
      label.style.setProperty("--c", c);
      label.innerHTML =
        '<input type="radio" name="' + name + '" value="' + c + '" aria-label="' + c + '"><span></span>';
      box.appendChild(label);
    });
    // last dot: choose any colour
    const custom = document.createElement("label");
    custom.className = "swatch custom";
    custom.innerHTML = '<input type="color" aria-label="Choose another colour"><span></span>';
    box.appendChild(custom);

    box.addEventListener("change", (e) => {
      state[key] = e.target.value;
      refreshSwatches(containerId, colours, key);
      applyColours();
      saveState();
    });
    custom.querySelector("input").addEventListener("input", (e) => {
      state[key] = e.target.value;
      refreshSwatches(containerId, colours, key);
      applyColours();
      saveState();
    });
  }

  function refreshSwatches(containerId, colours, key) {
    const box = $(containerId);
    const value = (state[key] || "").toLowerCase();
    const isPreset = colours.includes(value);
    box.querySelectorAll('input[type="radio"]').forEach((r) => { r.checked = r.value === value; });
    const custom = box.querySelector(".custom");
    const picker = custom.querySelector("input");
    custom.classList.toggle("selected", !isPreset);
    custom.classList.toggle("has-colour", !isPreset);
    if (!isPreset) { custom.style.setProperty("--c", value); picker.value = value; }
  }

  function applyColours() {
    root.style.setProperty("--bg", state.bgColour);
    root.style.setProperty("--title", state.titleColour);
    root.style.setProperty("--digits", state.digitColour);
    root.style.setProperty("--title-scale", state.titleSize / 100);
    root.style.setProperty("--digit-scale", state.digitSize / 100);
    $("titleSizeOut").textContent = state.titleSize + "%";
    $("digitSizeOut").textContent = state.digitSize + "%";
  }

  for (const id of ["titleSize", "digitSize"]) {
    $(id).addEventListener("input", () => {
      state[id] = Number($(id).value);
      applyColours();
      saveState();
    });
  }

  // ---------- countdown maths ----------
  function targetDate() {
    if (!state.date) return null;
    const d = new Date(state.date + "T" + (state.time || "00:00")); // local time
    return isNaN(d) ? null : d;
  }

  function parts() {
    const t = targetDate();
    const diff = t ? Math.max(0, t - Date.now()) : 0;
    const total = Math.ceil(diff / 60000); // round up so it reaches 0 exactly at the target
    return [
      ["d", Math.floor(total / 1440), "day", "days"],
      ["h", Math.floor((total % 1440) / 60), "hour", "hours"],
      ["m", total % 60, "minute", "minutes"],
    ];
  }

  function render() {
    const title = state.title || "";
    $("pTitle").textContent = title || "Title";
    $("sTitle").textContent = title;
    document.title = title || "Countdown";
    for (const [id, n, one, many] of parts()) {
      const word = n === 1 ? one : many;
      $("p" + id).textContent = n; $("p" + id + "l").textContent = word;
      $(id).textContent = n;       $(id + "l").textContent = word;
    }
  }

  // ---------- switching pages ----------
  function showSettings() {
    state.view = "settings";
    saveState();
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    $("screen").hidden = true;
    $("settings").hidden = false;
  }

  function showScreen() {
    state.view = "screen";
    saveState();
    $("settings").hidden = true;
    $("screen").hidden = false;
    render();
  }

  function goFullscreen() {
    if (!document.fullscreenElement && root.requestFullscreen) {
      root.requestFullscreen().catch(() => {});
    }
  }

  $("launch").addEventListener("click", () => {
    if (!targetDate()) {
      $("launchMsg").textContent = "Choose a date first.";
      $("date").focus();
      return;
    }
    $("launchMsg").textContent = "";
    showScreen();
    goFullscreen();
  });

  $("toSettings").addEventListener("click", (e) => {
    e.stopPropagation();
    showSettings();
  });

  // Clicking the countdown screen makes it full screen (handy after reopening the file).
  $("screen").addEventListener("click", goFullscreen);

  // Show the pointer and the Settings button only while the mouse moves.
  let idleTimer;
  function wake() {
    $("screen").classList.add("awake");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => $("screen").classList.remove("awake"), 3000);
  }
  $("screen").addEventListener("mousemove", wake);
  $("screen").addEventListener("touchstart", wake, { passive: true });

  // ---------- inputs ----------
  for (const id of ["title", "date", "time"]) {
    $(id).addEventListener("input", () => {
      state[id] = $(id).value;
      if (id === "date" && state.date) $("launchMsg").textContent = "";
      saveState();
      render();
    });
  }

  // ---------- start ----------
  loadState();
  $("title").value = state.title;
  $("date").value = state.date;
  $("time").value = state.time;
  $("titleSize").value = state.titleSize;
  $("digitSize").value = state.digitSize;
  buildSwatches("titleColour", TEXT_COLOURS, "titleColour");
  buildSwatches("digitColour", TEXT_COLOURS, "digitColour");
  buildSwatches("bgColour", BG_COLOURS, "bgColour");
  refreshSwatches("titleColour", TEXT_COLOURS, "titleColour");
  refreshSwatches("digitColour", TEXT_COLOURS, "digitColour");
  refreshSwatches("bgColour", BG_COLOURS, "bgColour");
  applyColours();
  render();
  if (state.view === "screen" && targetDate()) showScreen(); else showSettings();
  setInterval(render, 1000);
</script>
</body>
</html>
